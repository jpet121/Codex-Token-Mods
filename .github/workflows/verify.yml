name: Offline checks
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/verify.yml'
      - 'requirements.txt'
      - 'plugins/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install runtime and PDF test dependencies
        run: python -m pip install -r requirements.txt "reportlab>=4,<5"
      - name: Run the source-preserving read example
        run: python examples/replay_read.py
      - name: Check hooks and the local tool server
        run: python test_suite.py
      - name: Check handoffs, usage, and source handling
        run: python test_completion.py
      - name: Check task routing and previews
        run: python plugins/token-mods/test_flow.py
      - name: Check chat selection and reversible controls
        run: python easy-start/test_easy.py
